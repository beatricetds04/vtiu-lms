{% extends 'vclass/base_vclass.html' %}

{% block title %}Join Live Class{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-header text-white" style="background-color: #034d34;">
          <h4 class="mb-0">Join a Live Class</h4>
        </div>
        <div class="card-body">
          <p class="text-muted">Enter the room code shared by your teacher.</p>
          <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
              <label for="room_code" class="form-label fw-bold">Room code</label>
              <input
                id="room_code"
                name="room_code"
                type="text"
                class="form-control text-uppercase"
                value="{{ room_code or '' }}"
                maxlength="80"
                autocomplete="off"
                autocapitalize="characters"
                required
                autofocus
              >
            </div>
            <button type="submit" class="btn btn-success w-100">Find and Join Class</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
