{% extends "teacher/base_teacher.html" %}
{% block title %}{{ meeting.title }}{% endblock %}

{% block content %}
<div class="container-fluid py-3 live-classroom">
  <div id="room-error" class="alert alert-danger d-none" role="alert"></div>
  <div class="row g-3">
    <section id="video-panel" class="col-lg-9">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <div>
          <div class="small text-muted">{{ meeting.course.name }}</div>
          <h4 class="mb-0">{{ meeting.title }}</h4>
          <span id="connection-status" class="small text-muted">Connecting...</span>
          <button id="retry-room" type="button" class="btn btn-outline-danger btn-sm ms-2 d-none">Retry classroom connection</button>
        </div>
        <div class="small text-muted">
          <i class="fas fa-users text-primary me-1" aria-hidden="true"></i>
          <strong id="participant-count">0</strong> participants
          <span id="live-indicator" class="badge bg-secondary ms-2">Teacher preview</span>
        </div>
      </div>
      <div class="video-stage">
        <div id="video-grid" class="video-grid">
          <div id="local-tile" class="video-tile local-video-tile">
            <video id="local-preview" autoplay playsinline muted></video>
            <span class="video-label">You</span>
          </div>
        </div>
      </div>
    </section>

    <aside class="col-lg-3">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h6>Class controls</h6>
          <label for="camera-source" class="form-label small text-muted mt-2 mb-1">Camera source</label>
          <select id="camera-source" class="form-select form-select-sm mb-2" aria-label="Choose camera source" disabled>
            <option value="">Allow camera access in your browser...</option>
          </select>
          <button id="retry-camera" type="button" class="btn btn-outline-secondary btn-sm w-100 mb-2 d-none">Retry camera access</button>
          <button id="toggle-mic" type="button" class="btn btn-success w-100 mb-2" disabled>Mute microphone</button>
          <button id="toggle-camera" type="button" class="btn btn-success w-100 mb-2" disabled>Turn camera off</button>
          <button id="start-live" type="button" class="btn btn-danger w-100 mb-2" disabled>
            <i class="fas fa-video me-1" aria-hidden="true"></i>Start live class
          </button>
          <button id="share-screen" type="button" class="btn btn-outline-primary w-100" disabled>Share screen</button>
          <div id="broadcast-status" class="small text-muted mt-2">Preparing camera...</div>
        </div>
      </div>

      <div class="card border-0 shadow-sm mt-3">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <h6 class="mb-0">Class chat</h6>
            <span class="badge bg-primary-subtle text-primary small">Live</span>
          </div>
          <div id="class-chat-messages" class="chat-thread mb-3" aria-live="polite"></div>
          <textarea id="class-chat-input" class="form-control form-control-sm" rows="2" placeholder="Ask a question for everyone..."></textarea>
          <div class="d-grid mt-2">
            <button id="class-chat-send" type="button" class="btn btn-primary btn-sm">Send to class</button>
          </div>
        </div>
      </div>
      <a href="{{ url_for('teacher.meetings') }}" id="leave-class" class="btn btn-outline-secondary w-100 mt-3">Leave class</a>
    </aside>
  </div>
</div>

<style>
  .live-classroom { color: #17212b; }
  .video-stage { min-height: 560px; height: min(70vh, 760px); padding: .75rem; background: #0f1720; border: 1px solid #273646; border-radius: .9rem; overflow: hidden; }
  .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .75rem; min-height: 100%; }
  .video-tile { min-height: 300px; height: 100%; background: #17212b; border-radius: .5rem; position: relative; overflow: hidden; }
  .video-tile video { width: 100%; height: 100%; object-fit: contain; }
  .local-video-tile { grid-column: 1 / -1; min-height: 480px; }
  .video-label { position: absolute; left: .75rem; bottom: .5rem; color: white; background: rgba(0,0,0,.55); padding: .2rem .45rem; border-radius: .25rem; }
  .chat-thread { max-height: 280px; min-height: 48px; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; background: #f5f7fa; border-radius: .6rem; padding: .5rem; }
  .class-chat-message { background: white; border: 1px solid #e9ecef; border-radius: .5rem; padding: .5rem .6rem; overflow-wrap: anywhere; }
  .class-chat-message strong { display: block; font-size: .75rem; margin-bottom: .15rem; }
  .class-chat-message small { color: #6c757d; }
  @media (max-width: 767.98px) {
    .video-stage { min-height: 400px; height: 60vh; }
    .local-video-tile { min-height: 360px; }
  }
</style>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://unpkg.com/livekit-client@2.5.0/dist/livekit-client.umd.min.js"></script>
<script>
  const livekitUrl = {{ livekit_url|tojson }};
  const livekitToken = {{ livekit_token|tojson }};
  const conversationId = {{ class_conversation_id|tojson }};
  const currentUserPublicId = {{ current_user_public_id|tojson }};
  const startNotificationUrl = {{ url_for('vclass.start_live_meeting', meeting_id=meeting.id)|tojson }};
  const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
  const room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
  const videoGrid = document.getElementById('video-grid');
  const localPreview = document.getElementById('local-preview');
  const statusLabel = document.getElementById('connection-status');
  const errorBox = document.getElementById('room-error');
  const cameraSource = document.getElementById('camera-source');
  const startLiveButton = document.getElementById('start-live');
  const shareScreenButton = document.getElementById('share-screen');
  const broadcastStatus = document.getElementById('broadcast-status');
  const localTile = document.getElementById('local-tile');
  const socket = io();

  let previewStream = null;
  let localVideoTrack = null;
  let localAudioTrack = null;
  let isBroadcasting = false;
  let isMicMuted = false;
  let isCameraOff = false;
  let isSharingScreen = false;
  let startNotificationSent = false;
  let roomConnected = false;
  let roomConnecting = false;
  let roomConnectionAttempt = 0;
  let cameraReady = false;

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove('d-none');
  }

  function createVideoTile(participant, label) {
    let tile = document.getElementById(`tile-${participant.identity}`);
    if (!tile) {
      tile = document.createElement('div');
      tile.id = `tile-${participant.identity}`;
      tile.className = 'video-tile';
      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;
      const caption = document.createElement('span');
      caption.className = 'video-label';
      caption.textContent = label || participant.name || participant.identity;
      tile.append(video, caption);
      videoGrid.appendChild(tile);
    }
    return tile;
  }

  function attachTrack(track, participant) {
    if (track.kind !== LivekitClient.Track.Kind.Video) {
      if (track.kind === LivekitClient.Track.Kind.Audio) track.attach();
      return;
    }
    const tile = participant.identity === room.localParticipant.identity
      ? localTile
      : createVideoTile(participant);
    const video = tile.querySelector('video');
    video.muted = participant.identity === room.localParticipant.identity;
    track.attach(video);
  }

  function updateParticipantCount() {
    document.getElementById('participant-count').textContent = room.remoteParticipants.size;
  }

  room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
    attachTrack(track, participant);
    updateParticipantCount();
  });
  room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
    track.detach();
    if (track.kind === LivekitClient.Track.Kind.Video && participant.identity !== room.localParticipant.identity) {
      document.getElementById(`tile-${participant.identity}`)?.remove();
    }
  });
  room.on(LivekitClient.RoomEvent.ParticipantConnected, updateParticipantCount);
  room.on(LivekitClient.RoomEvent.ParticipantDisconnected, participant => {
    document.getElementById(`tile-${participant.identity}`)?.remove();
    updateParticipantCount();
  });
  room.on(LivekitClient.RoomEvent.Disconnected, () => {
    statusLabel.textContent = 'Disconnected';
    statusLabel.className = 'small text-danger';
  });

  function refreshCameraDevices(selectedId) {
    if (!navigator.mediaDevices?.enumerateDevices) {
      return Promise.reject(new Error('Camera device detection is unavailable in this browser.'));
    }

    return navigator.mediaDevices.enumerateDevices().then(devices => {
      const cameras = devices.filter(device => device.kind === 'videoinput');
      cameraSource.replaceChildren();
      cameras.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.textContent = device.label || `Camera ${index + 1}`;
        cameraSource.appendChild(option);
      });
      if (!cameras.length) {
        cameraSource.add(new Option('No cameras found', ''));
        cameraSource.disabled = true;
        return false;
      }
      const savedId = selectedId || localStorage.getItem('vtiu-camera-device-id');
      cameraSource.value = cameras.some(device => device.deviceId === savedId)
        ? savedId
        : cameras[0].deviceId;
      cameraSource.disabled = false;
      return true;
    });
  }

  async function prepareCamera(deviceId) {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Camera access is unavailable. Open this page in a supported browser over HTTPS.');
    }

    broadcastStatus.textContent = 'Allow camera and microphone access in your browser prompt.';
    statusLabel.textContent = 'Waiting for camera and microphone permission';
    let permissionWaitNotice = window.setTimeout(() => {
      if (!cameraReady) {
        showError('The browser is still waiting for camera or microphone permission. Allow access in the browser prompt, or check this site’s camera and microphone settings.');
      }
    }, 12000);
    const constraints = {
      audio: true,
      video: deviceId ? { deviceId: { exact: deviceId } } : true
    };
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } finally {
      window.clearTimeout(permissionWaitNotice);
    }
    if (previewStream) previewStream.getTracks().forEach(track => track.stop());
    previewStream = stream;
    previewStream.getAudioTracks().forEach(track => { track.enabled = !isMicMuted; });
    previewStream.getVideoTracks().forEach(track => { track.enabled = !isCameraOff; });
    localPreview.srcObject = previewStream;
    const activeVideoTrack = previewStream.getVideoTracks()[0];
    if (!activeVideoTrack) {
      throw new Error('The selected device did not provide a camera track.');
    }
    cameraReady = true;
    startLiveButton.disabled = !roomConnected;
    document.getElementById('toggle-mic').disabled = false;
    document.getElementById('toggle-camera').disabled = false;
    document.getElementById('retry-camera').classList.add('d-none');
    statusLabel.textContent = roomConnected
      ? 'Camera preview ready'
      : 'Camera ready. Waiting for the classroom connection.';
    broadcastStatus.textContent = roomConnected
      ? 'Camera ready. Start the live class when you are ready.'
      : 'Camera ready. Waiting for the classroom connection.';

    try {
      const activeCameraId = activeVideoTrack.getSettings().deviceId;
      const devicesFound = await refreshCameraDevices(deviceId || activeCameraId);
      if (!devicesFound) {
        cameraSource.replaceChildren(new Option(activeVideoTrack.label || 'Current camera', activeCameraId || ''));
        cameraSource.disabled = true;
        broadcastStatus.textContent = 'Camera preview is ready, but no selectable camera devices were reported.';
      }
    } catch (error) {
      console.error('Unable to enumerate camera devices', error);
      cameraSource.replaceChildren(new Option(activeVideoTrack.label || 'Current camera', activeVideoTrack.getSettings().deviceId || ''));
      cameraSource.disabled = true;
      broadcastStatus.textContent = 'Camera preview is ready, but the camera list could not be loaded.';
    }
  }

  async function connectRoom() {
    if (roomConnected || roomConnecting) return;

    roomConnecting = true;
    const attempt = ++roomConnectionAttempt;
    const retryButton = document.getElementById('retry-room');
    retryButton.classList.add('d-none');
    statusLabel.textContent = 'Connecting to the live classroom...';
    statusLabel.className = 'small text-muted';
    let timeoutId;

    try {
      const connection = room.connect(livekitUrl, livekitToken);
      connection.then(() => {
        if (attempt !== roomConnectionAttempt) room.disconnect();
      }).catch(() => {});
      await Promise.race([
        connection,
        new Promise((resolve, reject) => {
          timeoutId = window.setTimeout(
            () => reject(new Error('The classroom connection timed out. Check the LiveKit URL, project API key/secret, and Railway network logs.')),
            20000
          );
        })
      ]);
      if (attempt !== roomConnectionAttempt) {
        await room.disconnect();
        return;
      }
      roomConnected = true;
      statusLabel.textContent = cameraReady
        ? 'Connected. Camera preview is ready.'
        : 'Connected. Preparing camera...';
      statusLabel.className = 'small text-success';
      updateParticipantCount();
      room.remoteParticipants.forEach(participant => {
        participant.trackPublications.forEach(publication => {
          if (publication.track) attachTrack(publication.track, participant);
        });
      });
      startLiveButton.disabled = !cameraReady;
    } catch (error) {
      if (attempt !== roomConnectionAttempt) return;
      console.error('Unable to connect to the live classroom', error);
      roomConnectionAttempt += 1;
      roomConnecting = false;
      await room.disconnect();
      statusLabel.textContent = 'Classroom connection failed';
      statusLabel.className = 'small text-danger';
      showError(error.message || 'Could not connect to the live classroom. Check the LiveKit URL and that the API key and secret belong to the same LiveKit project.');
      retryButton.classList.remove('d-none');
      broadcastStatus.textContent = cameraReady
        ? 'Camera ready. Waiting for the classroom connection.'
        : 'Waiting for the classroom connection and camera setup.';
    } finally {
      window.clearTimeout(timeoutId);
      if (attempt === roomConnectionAttempt) roomConnecting = false;
    }
  }

  document.getElementById('retry-room').addEventListener('click', connectRoom);

  async function initializeCamera() {
    try {
      await prepareCamera();
    } catch (error) {
      console.error('Unable to initialize the teacher camera', error);
      cameraSource.replaceChildren(new Option('Camera access unavailable', ''));
      cameraSource.disabled = true;
      startLiveButton.disabled = true;
      document.getElementById('retry-camera').classList.remove('d-none');
      statusLabel.textContent = 'Camera setup failed';
      statusLabel.className = 'small text-danger';
      broadcastStatus.textContent = error.name === 'NotAllowedError'
        ? 'Camera or microphone access was denied. Allow access in browser settings, then retry.'
        : error.name === 'NotFoundError'
          ? 'No camera or microphone was found. Connect a device, then retry.'
          : error.name === 'NotReadableError'
            ? 'The camera or microphone is busy in another app. Close that app, then retry.'
            : error.message || 'Camera setup failed.';
      showError(error.name === 'NotAllowedError'
        ? 'Camera or microphone access was denied. Allow access in your browser settings and retry camera access.'
        : error.name === 'NotFoundError'
          ? 'No camera or microphone was found. Connect a device and retry camera access.'
          : error.name === 'NotReadableError'
            ? 'The camera or microphone could not be opened. Close other apps that may be using it, then retry.'
            : error.message || 'Camera setup failed. Check the device connection and browser permissions.');
    }
  }

  document.getElementById('retry-camera').addEventListener('click', initializeCamera);

  cameraSource.addEventListener('change', async event => {
    if (!event.target.value) return;
    try {
      if (isBroadcasting && localVideoTrack?.setDeviceId) {
        await localVideoTrack.setDeviceId(event.target.value);
        localStorage.setItem('vtiu-camera-device-id', event.target.value);
      } else if (!isBroadcasting) {
        await prepareCamera(event.target.value);
        localStorage.setItem('vtiu-camera-device-id', event.target.value);
      }
    } catch (error) {
      console.error('Unable to switch camera source', error);
      showError(error.message || 'Unable to switch to that camera. Check browser permissions and try again.');
      try {
        await refreshCameraDevices();
      } catch (refreshError) {
        console.error('Unable to refresh camera devices', refreshError);
      }
    }
  });

  document.getElementById('toggle-mic').addEventListener('click', async event => {
    isMicMuted = !isMicMuted;
    if (localAudioTrack) {
      if (isMicMuted) await localAudioTrack.mute();
      else await localAudioTrack.unmute();
    } else {
      previewStream?.getAudioTracks().forEach(track => { track.enabled = !isMicMuted; });
    }
    event.currentTarget.textContent = isMicMuted ? 'Unmute microphone' : 'Mute microphone';
  });

  document.getElementById('toggle-camera').addEventListener('click', async event => {
    isCameraOff = !isCameraOff;
    if (localVideoTrack) {
      if (isCameraOff) await localVideoTrack.mute();
      else await localVideoTrack.unmute();
    } else {
      previewStream?.getVideoTracks().forEach(track => { track.enabled = !isCameraOff; });
    }
    event.currentTarget.textContent = isCameraOff ? 'Turn camera on' : 'Turn camera off';
    localPreview.classList.toggle('d-none', isCameraOff);
  });

  async function notifyClassStarted() {
    const response = await fetch(startNotificationUrl, {
      method: 'POST',
      headers: { 'X-CSRFToken': csrfToken }
    });
    if (!response.ok) {
      throw new Error('Class is live, but student notifications could not be sent.');
    }
    startNotificationSent = true;
  }

  async function startBroadcast() {
    startLiveButton.disabled = true;
    try {
      const [videoMediaTrack] = previewStream.getVideoTracks();
      const [audioMediaTrack] = previewStream.getAudioTracks();
      if (!videoMediaTrack || !audioMediaTrack) {
        throw new Error('A camera and microphone are required to start the class.');
      }
      localVideoTrack = new LivekitClient.LocalVideoTrack(videoMediaTrack);
      localAudioTrack = new LivekitClient.LocalAudioTrack(audioMediaTrack);
      await room.localParticipant.publishTrack(localVideoTrack);
      await room.localParticipant.publishTrack(localAudioTrack);
      isBroadcasting = true;
      document.getElementById('live-indicator').className = 'badge bg-danger ms-2';
      document.getElementById('live-indicator').textContent = 'Live';
      startLiveButton.innerHTML = '<i class="fas fa-stop me-1" aria-hidden="true"></i>Stop live class';
      startLiveButton.classList.replace('btn-danger', 'btn-outline-danger');
      shareScreenButton.disabled = false;
      cameraSource.disabled = true;
      broadcastStatus.textContent = 'You are live. Students can join the class now.';
      statusLabel.textContent = 'Broadcasting live';
      if (!startNotificationSent) {
        try {
          await notifyClassStarted();
        } catch (notificationError) {
          console.error('Unable to notify students that class started', notificationError);
          showError(notificationError.message);
        }
      }
    } catch (error) {
      console.error('Unable to start the live class', error);
      showError(error.message || 'Unable to start the live class. Check your camera and microphone permissions.');
      if (localVideoTrack) await room.localParticipant.unpublishTrack(localVideoTrack, false);
      if (localAudioTrack) await room.localParticipant.unpublishTrack(localAudioTrack, false);
      localVideoTrack = null;
      localAudioTrack = null;
      startLiveButton.disabled = false;
    }
  }

  async function stopBroadcast() {
    startLiveButton.disabled = true;
    try {
      if (isSharingScreen) await room.localParticipant.setScreenShareEnabled(false);
      if (localVideoTrack) await room.localParticipant.unpublishTrack(localVideoTrack);
      if (localAudioTrack) await room.localParticipant.unpublishTrack(localAudioTrack);
      localVideoTrack = null;
      localAudioTrack = null;
      isBroadcasting = false;
      isSharingScreen = false;
      previewStream = null;
      localPreview.srcObject = null;
      document.getElementById('screen-tile')?.remove();
      document.getElementById('live-indicator').className = 'badge bg-secondary ms-2';
      document.getElementById('live-indicator').textContent = 'Teacher preview';
      startLiveButton.innerHTML = '<i class="fas fa-video me-1" aria-hidden="true"></i>Start live class';
      startLiveButton.classList.replace('btn-outline-danger', 'btn-danger');
      shareScreenButton.disabled = true;
      shareScreenButton.textContent = 'Share screen';
      cameraSource.disabled = false;
      isMicMuted = false;
      isCameraOff = false;
      document.getElementById('toggle-mic').textContent = 'Mute microphone';
      document.getElementById('toggle-camera').textContent = 'Turn camera off';
      localPreview.classList.remove('d-none');
      await prepareCamera(cameraSource.value);
      broadcastStatus.textContent = 'Live class stopped. Start again when ready.';
      statusLabel.textContent = 'Broadcast stopped';
    } catch (error) {
      console.error('Unable to stop the live class cleanly', error);
      showError('Unable to stop the live class cleanly. Leave the room and reconnect.');
    } finally {
      startLiveButton.disabled = false;
    }
  }

  startLiveButton.addEventListener('click', () => {
    if (isBroadcasting) stopBroadcast();
    else startBroadcast();
  });

  shareScreenButton.addEventListener('click', async () => {
    if (!isBroadcasting) return;
    try {
      await room.localParticipant.setScreenShareEnabled(!isSharingScreen);
      isSharingScreen = !isSharingScreen;
      shareScreenButton.textContent = isSharingScreen ? 'Stop sharing screen' : 'Share screen';
      if (isSharingScreen) {
        const publication = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.ScreenShare);
        if (publication?.track) {
          const tile = document.createElement('div');
          tile.id = 'screen-tile';
          tile.className = 'video-tile';
          tile.innerHTML = '<video autoplay playsinline muted></video><span class="video-label">Shared screen</span>';
          videoGrid.prepend(tile);
          publication.track.attach(tile.querySelector('video'));
        }
      } else {
        document.getElementById('screen-tile')?.remove();
      }
    } catch (error) {
      console.error('Unable to share screen', error);
      showError('Unable to share the screen. Check browser permissions and try again.');
    }
  });

  document.getElementById('leave-class').addEventListener('click', async event => {
    event.preventDefault();
    previewStream?.getTracks().forEach(track => track.stop());
    await room.disconnect();
    window.location.href = event.currentTarget.href;
  });

  function appendClassChatMessage(message) {
    const item = document.createElement('div');
    item.className = 'class-chat-message';
    const sender = document.createElement('strong');
    sender.textContent = message.sender_name || 'Class member';
    const content = document.createElement('div');
    content.textContent = message.content || '';
    const time = document.createElement('small');
    time.textContent = message.created_at || '';
    item.append(sender, content, time);
    const messages = document.getElementById('class-chat-messages');
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
  }

  async function loadClassChatHistory() {
    try {
      const response = await fetch(`/chat/conversations/${conversationId}/messages`);
      if (!response.ok) throw new Error(`Chat history request failed (${response.status}).`);
      const messages = await response.json();
      (messages || []).forEach(appendClassChatMessage);
    } catch (error) {
      console.error('Failed to load class chat history', error);
      showError('Class chat history could not be loaded.');
    }
  }

  function sendClassChatMessage() {
    const input = document.getElementById('class-chat-input');
    const value = input.value.trim();
    if (!value) return;
    socket.emit('send_message', { conversation_id: conversationId, message: value });
    input.value = '';
  }

  socket.on('connect', () => {
    socket.emit('join', { user_id: currentUserPublicId });
    socket.emit('class_presence_join', { conversation_id: conversationId });
  });
  socket.on('new_message', data => {
    if (String(data.conversation_id) === String(conversationId)) appendClassChatMessage(data.message);
  });
  document.getElementById('class-chat-send').addEventListener('click', sendClassChatMessage);
  document.getElementById('class-chat-input').addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendClassChatMessage();
    }
  });
  loadClassChatHistory();

  connectRoom();
  initializeCamera();
</script>
{% endblock %}
